<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">

    <title>ESP32 Web Bluetooth</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=change_history,square,stacked_line_chart,user_attributes,waves" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            text-align: center;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        #status {
            color: gray;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        #connectBtn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 16px;
            padding: 16px;
            font-size: 1.1rem;
            cursor: pointer;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            touch-action: manipulation;
        }

        #connectBtn:active {
            background: #f0f0f0;
        }

        #connectBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #controls {
            margin-top: 8px;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 16px;
            width: 100%;
            max-width: 500px;
        }

        .icon-btn {
            flex: 1;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s, background-color 0.1s;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background-color: #f0f0f0;
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .icon-btn img {
            width: 80%;
            height: auto;
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-size: clamp(28px, 7vw, 42px);
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 40;
            pointer-events: none;
        }

        .slider-group {
            margin-bottom: 16px;
        }

        .slider-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        input[type="range"] {
            display: block;
            margin: 0 auto;
            height: 60px;
            width: min(90vw, 480px);
            cursor: pointer;
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>ESP32 Control</h1>
    <p id="status">Disconnected</p>

    <button id="connectBtn">Connect to ESP32</button>

    <div id="controls">
        <div class="button-row">
            <button class="icon-btn" id="btn1" onclick="sendBtn('1')" disabled>
                <span class="material-symbols-outlined">change_history</span>
            </button>
            <button class="icon-btn" id="btn2" onclick="sendBtn('3')" disabled>
                <span class="material-symbols-outlined">square</span>
            </button>
            <button class="icon-btn" id="btn3" onclick="sendBtn('0')" disabled>
                <span class="material-symbols-outlined">waves</span>
            </button>
            <button class="icon-btn" id="btn4" onclick="sendBtn('2')" disabled>
                <span class="material-symbols-outlined">stacked_line_chart</span>
            </button>
            <button class="icon-btn" id="btn5" onclick="sendBtn('4')" disabled>
                <span class="material-symbols-outlined">user_attributes</span>
            </button>
        </div>

        <div class="slider-group">
            <label>Stroke Length: <span id="val1">0</span></label>
            <input type="range" id="slider1" min="0" max="255" value="0" disabled>
        </div>

        <div class="slider-group">
            <label>Stroke Speed: <span id="val2">0</span></label>
            <input type="range" id="slider2" min="0" max="255" value="0" disabled>
        </div>
    </div>

    <script>
        const serviceUUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const characteristicUUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice;
        let bleCharacteristic;
        let pollData;

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('status');
        const slider1 = document.getElementById('slider1');
        const slider2 = document.getElementById('slider2');
        const val1Text = document.getElementById('val1');
        const val2Text = document.getElementById('val2');

        connectBtn.addEventListener('click', async () => {
            try {
                statusText.textContent = "Requesting Bluetooth Device...";

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "ESP32 Control" }],
                    optionalServices: [serviceUUID]
                });

                statusText.textContent = "Connecting to GATT Server...";
                const server = await bleDevice.gatt.connect();

                const service = await server.getPrimaryService(serviceUUID);
                bleCharacteristic = await service.getCharacteristic(characteristicUUID);

                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                statusText.textContent = "Connected!";
                connectBtn.disabled = true;
                updateButtons(true);
                slider1.disabled = false;
                slider2.disabled = false;

                pollData = setInterval(writeSliderValue, 100);

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.log("Error:", error);
                statusText.textContent = "Connection Failed: " + error;
            }
        });

        async function sendCommand(value) {
            if (!bleCharacteristic) return;
            const encoder = new TextEncoder();
            await bleCharacteristic.writeValueWithoutResponse(encoder.encode(value));
        }

        function onDisconnected() {
            statusText.textContent = "Disconnected";
            statusText.style.color = "gray";
            clearInterval(pollData);
            connectBtn.disabled = false;
            updateButtons(false);
            slider1.disabled = true;
            slider2.disabled = true;
        }

        function updateButtons(state) {
            document.querySelectorAll('.icon-btn').forEach(btn => btn.disabled = !state);
        }

        function handleNotifications(event) {
            const value = new TextDecoder().decode(event.target.value);
            console.log("Received Status: " + value);

            if (value.startsWith('S')) {
                const data = value.substring(1).split(',');
                statusText.textContent = `Live Status - Length: ${data[0]}`;
                statusText.style.color = "#4CAF50";
            }
        }

        async function writeSliderValue() {
            val1Text.textContent = slider1.value;
            await sendCommand("A" + slider1.value);

            val2Text.textContent = slider2.value;
            await sendCommand("B" + slider2.value);
        }

        async function sendBtn(id) {
            await sendCommand("C" + id);
        }
    </script>
</body>
</html>
