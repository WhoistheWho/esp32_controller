<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">

    <title>ESP32 Web Bluetooth</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=change_history,square,stacked_line_chart,user_attributes,waves" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: sans-serif;
            text-align: center;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1 { margin: 0 0 8px; font-size: 1.5rem; }

        #status { color: gray; margin-bottom: 12px; font-size: 0.9rem; }

        .connect-row {
            display: flex;
            gap: 8px;
            max-width: 400px;
            margin: 0 auto 12px;
        }

        #connectBtn, #disconnectBtn {
            flex: 1;
            padding: 16px;
            font-size: 1.1rem;
            cursor: pointer;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            touch-action: manipulation;
        }

        #connectBtn:active, #disconnectBtn:active { background: #f0f0f0; }
        #connectBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #disconnectBtn { display: none; }

        #estopBtn {
            display: none;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 16px;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid #c62828;
            border-radius: 8px;
            background: #f44336;
            color: white;
            touch-action: manipulation;
            transition: transform 0.1s, background 0.1s;
        }

        #estopBtn:active {
            background: #b71c1c;
            transform: scale(0.97);
        }

        #controls { margin-top: 8px; }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 16px;
            width: 100%;
            max-width: 500px;
        }

        .icon-btn {
            flex: 1;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s, background-color 0.1s, border-color 0.1s;
        }

        .icon-btn:active { transform: scale(0.9); background-color: #f0f0f0; }

        .icon-btn.active {
            background-color: #4CAF50;
            border-color: #388E3C;
            color: white;
        }

        .icon-btn.active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;
        }

        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .material-symbols-outlined {
            font-size: clamp(28px, 7vw, 42px);
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 40;
            pointer-events: none;
        }

        .slider-group { margin-bottom: 16px; }

        .slider-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        input[type="range"] {
            display: block;
            margin: 0 auto;
            height: 60px;
            width: min(90vw, 480px);
            cursor: pointer;
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>ESP32 Control</h1>
    <p id="status">Disconnected</p>

    <div class="connect-row">
        <button id="connectBtn">Connect to ESP32</button>
        <button id="disconnectBtn">Disconnect</button>
    </div>

    <button id="estopBtn">&#9724; STOP</button>

    <div id="controls">
        <div class="button-row">
            <button class="icon-btn" id="btn1" onclick="sendBtn('1', this)" disabled>
                <span class="material-symbols-outlined">change_history</span>
            </button>
            <button class="icon-btn" id="btn2" onclick="sendBtn('3', this)" disabled>
                <span class="material-symbols-outlined">square</span>
            </button>
            <button class="icon-btn" id="btn3" onclick="sendBtn('0', this)" disabled>
                <span class="material-symbols-outlined">waves</span>
            </button>
            <button class="icon-btn" id="btn4" onclick="sendBtn('2', this)" disabled>
                <span class="material-symbols-outlined">stacked_line_chart</span>
            </button>
            <button class="icon-btn" id="btn5" onclick="sendBtn('4', this)" disabled>
                <span class="material-symbols-outlined">user_attributes</span>
            </button>
        </div>

        <div class="slider-group">
            <label>Stroke Length: <span id="val1">0</span></label>
            <input type="range" id="slider1" min="0" max="255" value="0" disabled>
        </div>

        <div class="slider-group">
            <label>Stroke Speed: <span id="val2">0</span></label>
            <input type="range" id="slider2" min="0" max="255" value="0" disabled>
        </div>
    </div>

    <script>
        const serviceUUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const characteristicUUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice, bleCharacteristic, pollData, wakeLock;
        let reconnectDelay = 1000;
        let reconnectTimer = null;
        let userDisconnected = false;
        let activeBtn = null;

        const connectBtn    = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const estopBtn      = document.getElementById('estopBtn');
        const statusText    = document.getElementById('status');
        const slider1       = document.getElementById('slider1');
        const slider2       = document.getElementById('slider2');
        const val1Text      = document.getElementById('val1');
        const val2Text      = document.getElementById('val2');

        // ── Wake Lock ──────────────────────────────────────────────
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try { wakeLock = await navigator.wakeLock.request('screen'); }
            catch (e) { console.log('Wake lock failed:', e); }
        }

        async function releaseWakeLock() {
            if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        }

        // Re-acquire when page becomes visible again while still connected
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && bleCharacteristic && !wakeLock) {
                await requestWakeLock();
            }
        });

        // ── UI state ───────────────────────────────────────────────
        function setConnectedState(connected) {
            connectBtn.style.display    = connected ? 'none' : '';
            disconnectBtn.style.display = connected ? ''     : 'none';
            estopBtn.style.display      = connected ? 'block': 'none';
            document.querySelectorAll('.icon-btn').forEach(b => b.disabled = !connected);
            slider1.disabled = !connected;
            slider2.disabled = !connected;
            statusText.style.color = connected ? '#4CAF50' : 'gray';
            if (!connected && activeBtn) {
                activeBtn.classList.remove('active');
                activeBtn = null;
            }
        }

        // ── Connect ────────────────────────────────────────────────
        connectBtn.addEventListener('click', async () => {
            try {
                userDisconnected = false;
                statusText.textContent = "Requesting Bluetooth Device...";
                statusText.style.color = 'gray';

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "ESP32 Control" }],
                    optionalServices: [serviceUUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                await connectToDevice();

            } catch (error) {
                console.log("Error:", error);
                statusText.textContent = "Connection Failed: " + error;
            }
        });

        async function connectToDevice() {
            statusText.textContent = "Connecting...";
            const server  = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(serviceUUID);
            bleCharacteristic = await service.getCharacteristic(characteristicUUID);
            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

            reconnectDelay = 1000;
            clearTimeout(reconnectTimer);
            statusText.textContent = "Connected!";
            setConnectedState(true);
            pollData = setInterval(writeSliderValue, 100);
            await requestWakeLock();
        }

        // ── Disconnect ─────────────────────────────────────────────
        disconnectBtn.addEventListener('click', () => {
            userDisconnected = true;
            clearTimeout(reconnectTimer);
            clearInterval(pollData);
            if (bleDevice?.gatt.connected) bleDevice.gatt.disconnect();
            bleCharacteristic = null;
            setConnectedState(false);
            statusText.textContent = "Disconnected";
            releaseWakeLock();
        });

        // ── Auto-reconnect ─────────────────────────────────────────
        function onDisconnected() {
            clearInterval(pollData);
            bleCharacteristic = null;
            setConnectedState(false);
            releaseWakeLock();

            if (userDisconnected) {
                statusText.textContent = "Disconnected";
                return;
            }

            scheduleReconnect();
        }

        function scheduleReconnect() {
            const delaySec = Math.round(reconnectDelay / 1000);
            statusText.textContent = `Lost connection — retrying in ${delaySec}s…`;
            statusText.style.color = '#FF9800';

            reconnectTimer = setTimeout(async () => {
                try {
                    await connectToDevice();
                } catch (e) {
                    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
                    scheduleReconnect();
                }
            }, reconnectDelay);
        }

        // ── E-Stop ─────────────────────────────────────────────────
        estopBtn.addEventListener('click', () => sendCommand("X"));

        // ── BLE helpers ────────────────────────────────────────────
        async function sendCommand(value) {
            if (!bleCharacteristic) return;
            await bleCharacteristic.writeValueWithoutResponse(new TextEncoder().encode(value));
        }

        function handleNotifications(event) {
            const value = new TextDecoder().decode(event.target.value);
            console.log("Received:", value);
            if (value.startsWith('S')) {
                const data = value.substring(1).split(',');
                statusText.textContent = `Live Status - Length: ${data[0]}`;
                statusText.style.color = "#4CAF50";
            }
        }

        async function writeSliderValue() {
            val1Text.textContent = slider1.value;
            await sendCommand("A" + slider1.value);
            val2Text.textContent = slider2.value;
            await sendCommand("B" + slider2.value);
        }

        async function sendBtn(id, el) {
            if (activeBtn) activeBtn.classList.remove('active');
            activeBtn = el;
            el.classList.add('active');
            await sendCommand("C" + id);
        }
    </script>
</body>
</html>
